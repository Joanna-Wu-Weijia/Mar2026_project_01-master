# MASTER workflow configuration — Alpha158 features
#
# Based on SJTU-DMTai/qlib  examples/benchmarks/MASTER/workflow_config_master_Alpha158.yaml
# (commit fbd067c0f0a58a9ba0399c5334d588f7f30c9b10)
#
# Adaptations for this repository
# ────────────────────────────────
# • provider_uri  → our local data folder  (~/Desktop/my_qlib_data)
# • Date ranges   → aligned with available data (2010-2026)
# • module_path   → master_model  (local bridge, no custom qlib fork needed)
# • Gate disabled → gate_input_start_index == gate_input_end_index == 158
#   (no separate market-index handler; Alpha158 features only)
#
# Usage:
#   python main.py --config workflow_config_master_Alpha158.yaml
#   python main.py --config workflow_config_master_Alpha158.yaml --only_backtest

qlib_init:
    provider_uri: ~/Desktop/my_qlib_data
    region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2010-01-01
    end_time: 2026-03-20
    fit_start_time: 2010-01-01
    fit_end_time: 2014-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 30
    backtest:
        start_time: 2017-01-01
        end_time: 2026-03-20
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            deal_price: close

task:
    model:
        class: MASTERModel
        module_path: master_model
        kwargs:
            seed: 0
            n_epochs: 40
            lr: 0.000008
            train_stop_loss_thred: 0.95
            market: *market
            benchmark: *benchmark
            save_prefix: *market
            # Alpha158 = 158 features; gate disabled (no market-index features)
            d_feat: 158
            d_model: 256
            t_nhead: 4
            s_nhead: 2
            gate_input_start_index: 158
            gate_input_end_index: 158
            T_dropout_rate: 0.5
            S_dropout_rate: 0.5
            beta: 1.0
            GPU: 0
            save_path: model/

    dataset:
        class: TSDatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2010-01-01, 2014-12-31]
                valid: [2015-01-01, 2016-12-31]
                test:  [2017-01-01, 2026-03-20]
            step_len: 8

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: False
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
