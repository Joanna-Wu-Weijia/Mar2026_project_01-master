# 本地 qlib 数据目录：按你的实际路径改 provider_uri（需含 calendars / features / instruments）
qlib_init:
    provider_uri: ~/Desktop/my_qlib_data
    region: cn

market: &market csi300
benchmark: &benchmark sh000300

fit_start: &fit_start 2020-01-03
fit_end:   &fit_end   2023-09-24



data_handler_config: &data_handler_config
    start_time: 2020-01-03
    end_time: 2026-03-20
    instruments: *market
    data_loader:
        class: QlibDataLoader
        kwargs:
            config:
                feature:
                    - - "$open/Ref($close,1)-1"           # OPEN_RET
                      - "$high/Ref($close,1)-1"           # HIGH_RET
                      - "$low/Ref($close,1)-1"            # LOW_RET
                      - "$close/Ref($close,1)-1"          # CLOSE_RET
                      - "$vwap/Ref($close,1)-1"           # VWAP_RET
                      - "Log($volume+1)"                   # LOG_VOL
                      - "Log($amount+1)"                   # LOG_AMT
                      - "($close-$low)/($high-$low+1e-8)" # INTRADAY
                      - "Ref($close,1)/Ref($close,6)-1"   # MOM5
                      - "Ref($close,1)/Ref($close,11)-1"  # MOM10
                    - - OPEN_RET
                      - HIGH_RET
                      - LOW_RET
                      - CLOSE_RET
                      - VWAP_RET
                      - LOG_VOL
                      - LOG_AMT
                      - INTRADAY
                      - MOM5
                      - MOM10
                label:
                    - - "Ref($close,-2)/Ref($close,-1)-1"
                    - - LABEL0
            freq: day
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fit_start_time: *fit_start
              fit_end_time:   *fit_end
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: RobustZScoreNorm
          kwargs:
              fit_start_time: *fit_start
              fit_end_time:   *fit_end
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature

# ---------------------------------------------------------------------------
# Task: model + dataset
# Segments: train : valid : test = 3 : 1 : 1 (by calendar span 2020-01-03 … 2026-03-20)
# ---------------------------------------------------------------------------
task:
    model:
        class: MASTERModel
        module_path: master_model
        kwargs:
            seed: 0
            n_epochs: 40
            lr: 0.000001
            train_stop_loss_thred: 0.95
            d_feat: 10
            d_model: 256
            t_nhead: 4
            s_nhead: 2
            gate_input_start_index: 10
            gate_input_end_index: 10
            T_dropout_rate: 0.5
            S_dropout_rate: 0.5
            GPU: 0
            save_path: model/
            save_prefix: *market

    dataset:
        class: TSDatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.data.dataset.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-01-03, 2023-09-24]
                valid: [2023-09-25, 2024-12-21]
                test:  [2024-12-22, 2026-03-20]
            step_len: 8
