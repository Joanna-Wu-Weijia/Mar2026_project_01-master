# MASTER configuration file
# Adapted from SJTU-DMTai/MASTER  qlib-update/workflow_config_master_Alpha158.yaml
#
# This file is read by run_qlib.py:
#   python run_qlib.py --config workflow_config_master.yaml
#
# Edit the values below to match your setup, then run the command above.
# CLI args passed to run_qlib.py override individual values here.

qlib_init:
    provider_uri: ~/Desktop/my_qlib_data  
    region: cn

market: &market csi300
benchmark: &benchmark sh000300

# RobustZScoreNorm fit window (anchors for processors below). Do not put these on DataHandlerLP —
# recent qlib passes unknown kwargs to DataHandler, which does not accept fit_*.
fit_start: &fit_start 2010-01-04
fit_end:   &fit_end   2022-12-31

# ---------------------------------------------------------------------------
# Data handler — 10 features derived from the available binary fields
# ---------------------------------------------------------------------------
data_handler_config: &data_handler_config
    start_time: 2010-01-04
    end_time: 2026-03-20
    instruments: *market
    data_loader:
        class: QlibDataLoader
        kwargs:
            config:
                feature:
                    - - "$open/Ref($close,1)-1"           # OPEN_RET
                      - "$high/Ref($close,1)-1"           # HIGH_RET
                      - "$low/Ref($close,1)-1"            # LOW_RET
                      - "$close/Ref($close,1)-1"          # CLOSE_RET
                      - "$vwap/Ref($close,1)-1"           # VWAP_RET
                      - "Log($volume+1)"                   # LOG_VOL
                      - "Log($amount+1)"                   # LOG_AMT
                      - "($close-$low)/($high-$low+1e-8)" # INTRADAY
                      - "Ref($close,1)/Ref($close,6)-1"   # MOM5
                      - "Ref($close,1)/Ref($close,11)-1"  # MOM10
                    - - OPEN_RET
                      - HIGH_RET
                      - LOW_RET
                      - CLOSE_RET
                      - VWAP_RET
                      - LOG_VOL
                      - LOG_AMT
                      - INTRADAY
                      - MOM5
                      - MOM10
                label:
                    - - "Ref($close,-2)/Ref($close,-1)-1"  # next-day return
                    - - LABEL0
            freq: day
    # infer_processors: used for valid and test sets (DK_I)
    # fit_start_time / fit_end_time tell RobustZScoreNorm which window to fit on
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fit_start_time: *fit_start
              fit_end_time:   *fit_end
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    # learn_processors: used for training set (DK_L)
    learn_processors:
        - class: RobustZScoreNorm
          kwargs:
              fit_start_time: *fit_start
              fit_end_time:   *fit_end
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature

# ---------------------------------------------------------------------------
# Task: model + dataset
# ---------------------------------------------------------------------------
task:
    model:
        class: MASTERModel
        module_path: master_model
        kwargs:
            seed: 0
            n_epochs: 40
            lr: 0.000001
            train_stop_loss_thred: 0.95
            d_feat: 10
            d_model: 256
            t_nhead: 4
            s_nhead: 2
            gate_input_start_index: 10
            gate_input_end_index: 10
            T_dropout_rate: 0.5
            S_dropout_rate: 0.5
            GPU: 0
            save_path: model/
            save_prefix: *market

    dataset:
        class: TSDatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.data.dataset.handler
                kwargs: *data_handler_config
            segments:
                train: [2010-01-04, 2022-12-31]
                valid: [2023-01-01, 2024-12-31]
                test:  [2025-01-01, 2026-03-20]
            step_len: 8                  
